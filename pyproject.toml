[project]
name = "aerocm"
version = "0.3.0-beta"
description = "AeroCM: standardised climate models dedicated to aviation"
authors = [
    {name = "Thomas PLANES", email = "thomas.planes@isae-supaero.fr"},
    {name = "Felix POLLET", email = "felix.pollet@isae-supaero.fr"}
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11, <3.15"

dependencies = [
    "numpy>=1.23, <=2.3.3",
    "pandas>=2.1.0,<=2.3.2",
    "fair==2.2.2",
    "jupyterlab>=4.0.0,<5.0.0",
    "xarray>=2024.2.0,<2025.0.0",
    "ipympl>=0.9.3,<0.10.0",

]

[project.optional-dependencies]
publications = [
    "salib>=1.5.1,<1.6.0",
    "cartopy>=0.25.0,<0.26.0",
    "scikit-learn>=1.7.2,<1.8.0",
    "seaborn>=0.13.2,<0.14.0",
    "netCDF4>=1.7.2,<1.8.0",
    "openpyxl>=3.1.5,<3.2.0",
    "geographiclib>=2.1,<2.2",
    "scipy>=1.17.0,<1.18.0"
]

[dependency-groups]
doc = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-bibtex>=2.16.0,<3.0.0",
    "mkdocs-jupyter>=0.25.1,<0.26.0",
    "mkdocs-material>=9.7.0,<10.0.0",
    "mkdocstrings[python]>=0.30.0,<1.0.0",
    "mike>=2.0.0,<3.0.0"
]


[tool.uv]
default-groups = "all"
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]

build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

