site_name: AeroCM Documentation
site_url: https://aeromaps.github.io/AeroCM/
repo_url: https://github.com/AeroMAPS/AeroCM
repo_name: AeroCM

nav:
  - Home: index.md
  - Installation: books/installation.md
  - API Reference:
      - Overview: api/index.md
  - AeroCM Code and Models:

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.path
    - search.highlight
    - search.suggest
    - toc.integrate
    - content.code.annotate
    - navigation.indexes
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      primary: indigo
      accent: teal
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: teal
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: indigo
      accent: teal
  logo: assets/logo_white.png


plugins:
  - search
  - mike
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            separate_signature: true
            merge_init_into_class: true
            show_private_members: true
            inherited_members: false
            members_order: source
  - mkdocs-jupyter

markdown_extensions:
  - admonition
  - toc:
      permalink: true

extra:
  version:
    provider: mike